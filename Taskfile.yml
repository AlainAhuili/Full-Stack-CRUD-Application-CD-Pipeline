version: '3'

tasks:
  # The overarching orchestrator for the local commit stage
  commit-stage:
    desc: Run the entire local commit stage validation loop
    deps: [lint, test:unit]
    cmds:
      - echo "Commit Stage Passed Locally! Safe to push."

  lint:
    desc: Run linters and syntax checks across all layers
    cmds:
      - cd frontend && npm run lint
      - cd backend && npm run lint

  test:unit:
    desc: Run high-speed isolated unit tests
    cmds:
      - cd frontend && npm run test:unit
      - cd backend && npm run test:unit