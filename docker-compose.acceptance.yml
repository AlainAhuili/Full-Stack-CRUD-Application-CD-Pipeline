version: '3.8'

services:
  db-test:
    image: crud-database:${GIT_SHA:-local}
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: crud_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d crud_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-test:
    image: crud-backend:${GIT_SHA:-local}
    environment:
      NODE_ENV: test
      DB_HOST: db-test
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: crud_test_db
      JWT_SECRET: test_jwt_signing_key_secret
    ports:
      - "3001:3000"
    depends_on:
      db-test:
        condition: service_healthy

  frontend-test:
    image: crud-frontend:${GIT_SHA:-local}
    ports:
      - "8081:8080"
    depends_on:
      - backend-test
