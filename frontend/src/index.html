<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Tier CRUD Application</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div class="min-h-screen flex flex-col">
        <header class="bg-slate-900 text-white shadow-md p-6">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold tracking-tight">3-Tier Automation Portal</h1>
                <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-mono">
                    Status: Connected to Database
                </span>
            </div>
        </header>

        <main class="flex-grow max-w-6xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <section class="bg-white p-6 rounded-xl shadow-xs border border-slate-200 h-fit">
                <h2 class="text-lg font-semibold text-slate-900 mb-4">Add New User</h2>
                <form id="userForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
                        <input type="text" id="userName" required autocomplete="name"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-slate-900"
                            placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="userEmail" required autocomplete="email"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-slate-900"
                            placeholder="john@example.com">
                    </div>
                    <button type="submit" 
                        class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-lg transition-colors cursor-pointer">
                        Save User
                    </button>
                </form>
            </section>

            <section class="md:col-span-2 bg-white p-6 rounded-xl shadow-xs border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-900">Active Database Records</h2>
                    <button id="refreshBtn" class="text-sm text-slate-500 hover:text-slate-900 cursor-pointer flex items-center gap-1">
                        Refresh
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 bg-slate-50 text-xs font-semibold uppercase text-slate-500 tracking-wider">
                                <th class="py-3 px-4">ID</th>
                                <th class="py-3 px-4">Name</th>
                                <th class="py-3 px-4">Email</th>
                                <th class="py-3 px-4">Created At</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="4" class="py-8 text-center text-slate-400">Loading user records from cloud engine...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
