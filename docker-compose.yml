version: '3.8'

services:
  database:
    image: crud-database:${GIT_SHA:-local}
    environment:
      - POSTGRES_DB=crud_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=supersecurepassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: crud-backend:${GIT_SHA:-local}
    environment:
      - DB_HOST=database
      - DB_USER=postgres
      - DB_PASSWORD=supersecurepassword
      - DB_NAME=crud_db
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: crud-frontend:${GIT_SHA:-local}
    ports:
      - "8080:8080"
    depends_on:
      - backend